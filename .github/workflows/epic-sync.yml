name: "Epic Branch Sync (PR Generator)"

# Manual execution only
on:
  workflow_dispatch:

# Ensure the GitHub token has permission to create PRs
permissions:
  pull-requests: write
  contents: read

jobs:
  create-sync-prs:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false # If one branch fails, let the others finish
      matrix:
        target_branch: 
          - Epic-1-1
          - Epic-1-2
          - Epic-1-2
          # Add more active Epic branches here as needed

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # We need full history to check if branches are in sync

      - name: Create Sync PR via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking sync status between main and ${{ matrix.target_branch }}..."
          
          # Use the gh CLI to open a Pull Request
          # 1. Check if a sync PR is already open to avoid spam
          OPEN_PR=$(gh pr list --base ${{ matrix.target_branch }} --head main --state open --json number --jq '.[0].number')
          
          if [ -n "$OPEN_PR" ]; then
            echo "A Sync PR (#$OPEN_PR) already exists for ${{ matrix.target_branch }}. Skipping."
            exit 0
          fi

          # 2. Attempt to create the PR
          # If main is already perfectly synced with the Epic branch, this command will safely fail.
          # We use '|| true' and check the output to handle this gracefully without crashing the workflow.
          PR_OUTPUT=$(gh pr create \
            --base ${{ matrix.target_branch }} \
            --head main \
            --title "🔄 Sync main into ${{ matrix.target_branch }}" \
            --body "Automated PR generated by GitHub Actions. Please review and resolve any merge conflicts." \
            2>&1) || true

          if [[ "$PR_OUTPUT" == *"No commits between"* ]]; then
            echo "✅ ${{ matrix.target_branch }} is already up to date with main. No PR needed."
          elif [[ "$PR_OUTPUT" == *"https://github.com"* ]]; then
            echo "🎉 Successfully created PR: $PR_OUTPUT"
          else
            echo "⚠️ Unexpected output: $PR_OUTPUT"
            # Optional: exit 1 here if you want the pipeline UI to show a red X on failure
          fi
